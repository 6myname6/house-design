server{
    listen 80;
    server_name _;

    # 与后端multipart上限对其，nginx默认1MB，
    client_max_body_size 20m;

    # dist将挂载到容器内此目录
    root /usr/share/nginx/html;
    index index.html;

    # gzip压缩：文本类响应压缩传输，省带宽，加快首屏
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    
    # 带hash的构建产物，长缓存
    location /assets/{
        expires 30d;
        add_header Cache-Control "public, immutable";

    }
    # index.html 必须每次协商缓存：重构建后旧 hash 文件已删除，
    # 浏览器若沿用缓存的旧 index.html 会引用不存在的 JS，整站白屏
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    # api 反向代理：compose网络里服务名就是域名
    location /api/{
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 对话生成最长 90s（langchain4j timeout），nginx 默认 60s 会提前掐断响应；
        # 与前端 axios 的 120s 超时对齐，留出余量
        proxy_read_timeout 120s;
    }

    # SPA history 路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }
}