# 筑梦家 · 复现版后端配置
# 安全规范：密码/密钥一律走环境变量注入（${VAR:默认值}），绝不硬编码进代码库
server:
  port: 8080

spring:
  application:
    name: house-design-backend
  datasource:
    # createDatabaseIfNotExist=true：库不存在时自动创建，无需手工建库
    url: jdbc:mysql://localhost:3306/house_design?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    # 本机实测 MySQL root 密码是 123456：export DB_PASSWORD=123456
    # 启动命令：export DB_PASSWORD=123456 && unset SERVER__PORT && bash mvn.sh spring-boot:run
    password:  ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

  # redis相关配置
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}  # 本地 Redis 无密码留空；生产用环境变量注入
      timeout: 3s
# 应用自定义配置（后续 P1-⑤ 由 AppProperties 用 @ConfigurationProperties 绑定）
app:
  # 文件存储根目录（设计图、生成结果等）
  storage:
    location: ./storage
    public-base-url: http://localhost:8080/files
  # JWT 配置
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-set-env}
    expiration-ms: 604800000  # 7 天
  # AI 文生图配置（直连智谱 CogView，Key 从环境变量注入；未配时生成任务 FAILED）
  ai:
    api-key: ${ZHIPU_API_KEY}
    base-url: "https://open.bigmodel.cn/api/paas/v4"
    image-model: "glm-4.6v-flash"
    timeout-seconds: 300
    # 对话补全配置（风格预优化用，免费 flash 文本模型）
    chat-model: "glm-4.7-flash"
    chat-timeout-seconds: 60
    vsion-model: glm-4.6v-flash



  login-limit:
    max-fail-count: 5 #连续失败次数
    lock-seconds: 600  #锁定时长
    

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 下划线列名 <-> 驼峰属性自动映射（t_user.created_at -> createdAt）
    map-underscore-to-camel-case: true
    # 开发期在控制台打印 SQL，方便排查；上线可移除或改日志级别
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 主键策略：数据库自增（对应 t_user.id AUTO_INCREMENT）
      id-type: auto
      # 逻辑删除（后续若引入 deleted 字段时启用）
      # logic-delete-field: deleted

logging:
  level:
    com.housedesign: INFO


langchain4j:
  open-ai:
    chat-model:
      temperature: 0.6
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ${ZHIPU_API_KEY}
      timeout: 90s
      log-requests: true
      log-responses: true
      model-name: glm-4.6v-flash
   
    