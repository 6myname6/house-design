# 筑梦家 · 复现版后端配置
# 安全规范：密码/密钥一律走环境变量注入（${VAR:默认值}），绝不硬编码进代码库
server:
  port: 8080

spring:
  application:
    name: house-design-backend
  datasource:
    # createDatabaseIfNotExist=true：库不存在时自动创建，无需手工建库
    # 主机/端口/库名全部外置，默认值对齐本地开发（MySQL 跑在 Docker Desktop）
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:house_design}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    # 本地开发默认 123456：export DB_PASSWORD=123456；生产 profile 下无默认值
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

  # Redis（本地 Docker：docker run -p 6379:6379 redis:7-alpine --requirepass 123456 --appendonly yes）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}  # 默认对齐本地 Docker 容器密码；生产 profile 下无默认值
      timeout: 3s
    
  # 邮件:账号/授权码走环境变量，本地默认空串（不配只影响发码，不影响启动）
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
# 应用自定义配置（后续 P1-⑤ 由 AppProperties 用 @ConfigurationProperties 绑定）
app:
  # 文件存储（设计图、头像、帖子图、AI 生成图等）：唯一后端为阿里云 OSS
  storage:
    # 外部图片（AI 出图临时链接）下载字节上限，默认 20MB（与上传上限对齐，防 OOM）
    max-download-bytes: ${STORAGE_MAX_DOWNLOAD_BYTES:20971520}
    # 阿里云 OSS（公共读 bucket；密钥只从环境变量注入，缺失则启动 fail-fast）
    oss:
      # endpoint / bucket / 公网域名全部外置，换环境无需改代码；默认值对齐当前开发 bucket
      endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
      bucket: ${OSS_BUCKET:mybucket0100}
      # 公共读访问域名 = https://{bucket}.{endpoint 去掉https://}
      public-base-url: ${OSS_PUBLIC_BASE_URL:https://mybucket0100.oss-cn-beijing.aliyuncs.com}
      # 密钥只从环境变量读，冒号后留空=默认空串，绝不写进代码库
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  # JWT 配置
  jwt:
    # 开发期默认值仅用于本地；生产部署必须用 JWT_SECRET 环境变量覆盖（上线前整改项，见 docs/bug优化/代码审查修复计划.md）
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-set-env}
    expiration-ms: 604800000  # 7 天
  # AI 文生图配置（直连智谱 CogView，Key 从环境变量注入；未配时生成任务 FAILED）
  ai:
    api-key: ${ZHIPU_API_KEY}
    base-url: "https://open.bigmodel.cn/api/paas/v4"
    # 文生图模型：images/generations 仅接受 cogview/glm-image 系列名（勿填视觉对话模型）；
    # 默认免费 cogview-3-flash，演示需要更高写实度时用环境变量切 cogview-4-250304
    image-model: ${AI_IMAGE_MODEL:cogview-3-flash}
    # 房间效果图尺寸：1440x720 = 2:1 宽幅，照片漫游全屏展示用
    room-image-size: 1440x720
    # 单套户型最多识别并出图的房间数（控制总耗时与风控风险）
    max-rooms: 6
    timeout-seconds: 300
    # 对话补全配置（风格预优化用，免费 flash 文本模型）
    chat-model: "glm-4.7-flash"
    chat-timeout-seconds: 60
    vsion-model: glm-4.6v-flash
    memory-ttl-seconds: 86400

  # 生成任务并发锁与超时对账
  generation:
    # 同项目"生成中"Redis 占位 TTL（秒）；任务开跑与每完成一个房间自动续期
    lock-ttl-seconds: ${GENERATION_LOCK_TTL:1800}
    # 中间态任务超时对账阈值（秒），必须 > lock-ttl；35min 无进展置 FAILED
    reconcile-stale-seconds: ${GENERATION_RECONCILE_STALE:2100}

  sms:
    provider: ${SMS_PROVIDER:mock}
    code-ttl-seconds: 300
    resend-interval-seconds: 60
    max-verify-fail-count: 5  #验证码输错次数

  login-limit:
    max-fail-count: 5 #连续失败次数
    lock-seconds: 600  #锁定时长

  # 邮箱验证码（A-11）：频控阈值与短信一致
  email:
    code-ttl-seconds: 300
    resend-interval-seconds: 60
    daily-email-limit: 10
    daily-ip-limit: 20
    daily-window-seconds: 86400
    from-name: 筑梦家 #收件人看到的昵称

  # 修改密码验证码（A-5）：独立 pwd:* key，两通道共用 60s 锁与日计数
  password-change:
    code-ttl-seconds: 300
    resend-interval-seconds: 60
    daily-limit: 10
    daily-window-seconds: 86400

  # 邮箱绑定/换绑（§10.8）：独立 bind:email:* key
  email-bind:
    code-ttl-seconds: 300
    resend-interval-seconds: 60
    daily-limit: 10
    daily-window-seconds: 86400

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 下划线列名 <-> 驼峰属性自动映射（t_user.created_at -> createdAt）
    map-underscore-to-camel-case: true
    # 开发期在控制台打印 SQL，方便排查；上线可移除或改日志级别
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 主键策略：数据库自增（对应 t_user.id AUTO_INCREMENT）
      id-type: auto
      # 逻辑删除（后续若引入 deleted 字段时启用）
      # logic-delete-field: deleted

logging:
  level:
    com.housedesign: INFO

# Actuator（第 7 步①加固）：只暴露 health 端点供容器 healthcheck 探活
management:
  endpoints:
    web:
      exposure:
        include: health  # 只暴露 health，其余端点（env/beans/metrics...）一律不对外
  endpoint:
    health:
      show-details: never  # 不返回 redis/db 等组件细节，防止内部拓扑泄露
  health:
    mail:
      enabled: false  # 排除 SMTP 健康检查：外部邮件服务抖动不应拖垮健康判定


langchain4j:
  open-ai:
    chat-model:
      temperature: 0.6
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: ${ZHIPU_API_KEY}
      timeout: 90s
      log-requests: false
      log-responses: true
      model-name: glm-4.6v-flash
   
    